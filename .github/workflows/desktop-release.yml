name: desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-ai-pet-v*'

permissions:
  contents: read

env:
  DESKTOP_VERSION: '0.1.0'
  MACOS_ARTIFACT: Desktop-AI-Pet-0.1.0-macos-aarch64.zip
  WINDOWS_ARTIFACT: Desktop-AI-Pet-0.1.0-windows-x64.zip

jobs:
  build-macos:
    name: build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Build macOS app bundle
        working-directory: app
        run: npm run tauri:build -- --target aarch64-apple-darwin --bundles app --ci

      - name: Package macOS app
        shell: bash
        run: |
          set -euo pipefail
          app_bundle="$(find app/src-tauri/target -path '*/release/bundle/macos/Desktop AI Pet.app' -type d | head -n 1)"
          test -n "$app_bundle"
          mkdir -p release-artifacts
          ditto -c -k --sequesterRsrc --keepParent "$app_bundle" "release-artifacts/${MACOS_ARTIFACT}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MACOS_ARTIFACT }}
          path: release-artifacts/${{ env.MACOS_ARTIFACT }}
          if-no-files-found: error

  build-windows:
    name: build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Build Windows executable
        working-directory: app
        env:
          SIMSIMD_TARGET_SIERRA: '0'
          SIMSIMD_TARGET_TURIN: '0'
          SIMSIMD_TARGET_SAPPHIRE: '0'
          SIMSIMD_TARGET_GENOA: '0'
          SIMSIMD_TARGET_ICE: '0'
          SIMSIMD_TARGET_SKYLAKE: '0'
          SIMSIMD_TARGET_HASWELL: '0'
        run: npm run tauri:build -- --no-bundle --ci

      - name: Package Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-artifacts | Out-Null
          New-Item -ItemType Directory -Force windows-portable | Out-Null
          Copy-Item 'app/src-tauri/target/release/app.exe' 'windows-portable/Desktop AI Pet.exe'
          @'
          Desktop AI Pet for Windows

          1. Unzip this archive.
          2. Run "Desktop AI Pet.exe".
          3. Import the adoption.pet file from the adoption site on first launch.

          Windows WebView2 Runtime is required. Most current Windows 10/11 machines already include it.
          '@ | Set-Content -Encoding UTF8 'windows-portable/README-Windows.txt'
          Compress-Archive -Path 'windows-portable/*' -DestinationPath "release-artifacts/${env:WINDOWS_ARTIFACT}" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.WINDOWS_ARTIFACT }}
          path: release-artifacts/${{ env.WINDOWS_ARTIFACT }}
          if-no-files-found: error

  build-site:
    name: build adoption site with downloads
    runs-on: ubuntu-latest
    needs:
      - build-macos
      - build-windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: site/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.MACOS_ARTIFACT }}
          path: site/public/downloads

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.WINDOWS_ARTIFACT }}
          path: site/public/downloads

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        env:
          VITE_DESKTOP_DOWNLOAD_BASE_URL: /downloads
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: pet-adoption-site
          path: site/dist
          if-no-files-found: error

  publish-github-release:
    name: publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - build-macos
      - build-windows
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.MACOS_ARTIFACT }}
          path: release-artifacts

      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.WINDOWS_ARTIFACT }}
          path: release-artifacts

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --draft --title "Desktop AI Pet ${DESKTOP_VERSION}" --notes "Desktop client downloads for the pet adoption site."
          gh release upload "${GITHUB_REF_NAME}" release-artifacts/* --clobber
